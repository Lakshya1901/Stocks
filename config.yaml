groww:
  # Credentials loaded from .env via TOTP flow
  # GROWW_TOTP_TOKEN and GROWW_TOTP_SECRET must be set in .env
  exchange: NSE
  segment: CASH
  product: MIS  # Intraday (Margin Intraday Square-off)

trading:
  mode: paper             # paper | live
  capital: 20000          # Total capital allocation
  max_per_trade: 4000     # Max per single trade (20% of capital)
  max_open_positions: 6
  max_daily_loss: 400     # 2% of capital — halt trading for the day

scanner:
  scan_universe: all      # "all" = scan every NSE equity from instrument CSV
  min_price: 1            # Include penny stocks
  max_price: 50000        # No upper bound
  top_picks: 50            # Stocks to trade each day
  min_avg_volume: 500000  # 20-day avg volume minimum
  min_atr_pct: 1.5        # Min ATR as % of price

market_hours:
  pre_market_scan: "09:00"
  market_open: "09:15"
  last_entry: "14:30"
  square_off: "15:10"
  market_close: "15:30"

strategies:
  vwap_reversion:
    enabled: true
    weight: 0.35
    rsi_oversold: 35
    rsi_overbought: 65
    vwap_deviation_pct: 0.5
  momentum_breakout:
    enabled: true
    weight: 0.35
    ema_fast: 9
    ema_slow: 21
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    volume_multiplier: 1.5
  opening_range_breakout:
    enabled: true
    weight: 0.30
    orb_window_minutes: 15
    timeout_hour: 10
    timeout_minute: 30

risk:
  stop_loss_pct: 1.0        # 1% per trade
  take_profit_pct: 2.0      # 2% per trade (2:1 reward/risk)
  trailing_stop_pct: 0.5    # 0.5% trailing stop
  max_drawdown_pct: 2.0     # Max daily drawdown
  max_sector_positions: 3   # Max positions in same sector

dashboard:
  host: "0.0.0.0"
  port: 8080
  debug: false
